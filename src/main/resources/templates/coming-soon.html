<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${featureName} + ' \u00b7 Hirezen'">Coming Soon</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header(${roleLabel})}"></div>

<main class="dash-content">
    <div class="coming-soon">
        <h1 th:text="${featureName}">Feature</h1>
        <p class="lead" th:text="${message}">This feature is coming soon.</p>
        <a th:if="${externalLinkUrl}" th:href="${externalLinkUrl}" target="_blank" rel="noopener"
           class="btn-primary" style="display:inline-block; width:auto;">
            <span th:text="${externalLinkLabel}">Visit</span>
        </a>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
