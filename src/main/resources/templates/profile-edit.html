<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile · Hirezen</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header(${roleLabel})}"></div>

<main class="dash-content">
<div class="section-center">

    <h1>Edit Profile</h1>

    <form th:action="@{/profile/edit}" method="post" enctype="multipart/form-data" class="profile-form">

        <div class="field profile-image-field">
            <label for="image">Profile photo</label>
            <img th:if="${profile.imageUrl}" th:src="${profile.imageUrl}" class="profile-image" alt="Current photo">
            <div th:unless="${profile.imageUrl}" class="profile-image profile-image-placeholder"
                 th:text="${#strings.substring(user.name, 0, 1)}">J</div>
            <input type="file" id="image" name="image" accept="image/png, image/jpeg, image/webp">
        </div>

        <div class="field">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" th:value="${user.name}" required>
        </div>

        <div class="field">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" th:value="${profile.phone}" placeholder="+1 555 123 4567">
        </div>

        <div class="field">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" th:value="${profile.location}" placeholder="City, Country">
        </div>

        <div class="field">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4" placeholder="A few lines about you" th:text="${profile.bio}"></textarea>
        </div>

        <div class="field">
            <label for="skills">Skills</label>
            <input type="text" id="skills" name="skills" th:value="${profile.skills}"
                   placeholder="Java, Spring Boot, SQL (comma-separated)">
        </div>

        <div class="field">
            <label for="resume">Resume / CV</label>
            <a th:if="${profile.resumeUrl}" th:href="${profile.resumeUrl}" target="_blank" rel="noopener"
               style="display:block; margin-bottom:8px; font-size:13px;"
               th:text="'Current file: ' + (${profile.resumeFileName} ?: 'view')">Current file</a>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
        </div>

        <button type="submit" class="btn-primary">Save Changes</button>
    </form>

    <a th:href="@{/profile}" style="display:inline-block; margin-top: 1rem;">Cancel</a>

</div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
