<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile · Hirezen</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header(${roleLabel})}"></div>

<main class="dash-content">
    <h1>Edit Profile</h1>

    <form th:action="@{/profile/edit}" method="post" class="profile-form">

        <div class="field">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" th:value="${profile.phone}" placeholder="+1 555 123 4567">
        </div>

        <div class="field">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" th:value="${profile.location}" placeholder="City, Country">
        </div>

        <div class="field">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" rows="4" placeholder="A few lines about you" th:text="${profile.bio}"></textarea>
        </div>

        <div class="field">
            <label for="skills">Skills</label>
            <input type="text" id="skills" name="skills" th:value="${profile.skills}"
                   placeholder="Java, Spring Boot, SQL (comma-separated)">
        </div>

        <button type="submit" class="btn-primary">Save Changes</button>
    </form>

    <a th:href="@{/profile}" style="display:inline-block; margin-top: 1rem;">Cancel</a>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
