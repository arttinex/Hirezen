<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Applicants · Hirezen</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header(${roleLabel})}"></div>

<main class="dash-content">
<div class="section-center">

    <h1 th:text="'Applicants · ' + ${job.title}">Applicants</h1>
    <p class="lead" th:text="${job.companyName} + ' · ' + ${job.location}">Company · Location</p>

    <a th:href="@{/jobs/mine}" style="display:inline-block; margin-bottom:20px;">Back to my postings</a>

    <div class="job-list" th:if="${not #lists.isEmpty(applicants)}">
        <div class="job-card" th:each="app : ${applicants}">
            <div class="job-card-header">
                <h3 th:text="${app.seeker.name}">Applicant Name</h3>
                <span class="job-status-badge" th:classappend="'status-' + ${#strings.toLowerCase(app.status.name())}"
                      th:text="${app.status.label()}">Applied</span>
            </div>
            <p class="job-meta" th:text="${app.seeker.hirezenId} + ' · ' + ${app.seeker.email}">
                HZS1 · seeker@example.com
            </p>
            <p class="job-meta" th:text="'Applied ' + ${#temporals.format(app.appliedAt, 'MMM d, yyyy')}">
                Applied on
            </p>
            <a th:href="@{/messages/{id}(id=${app.seeker.id})}" style="display:inline-block; margin-top:8px; font-size:13px;">Message</a>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(applicants)}" class="lead">No applicants yet.</p>

</div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
