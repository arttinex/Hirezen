<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Post a Job · Hirezen</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header(${roleLabel})}"></div>

<main class="dash-content">
<div class="section-center">

    <h1>Post a Job</h1>

    <form th:action="@{/jobs/new}" method="post" class="profile-form">

        <div class="field">
            <label for="title">Job title</label>
            <input type="text" id="title" name="title" placeholder="Backend Engineer Intern" required>
        </div>

        <div class="field">
            <label for="companyName">Company name</label>
            <input type="text" id="companyName" name="companyName" placeholder="Acme Inc." required>
        </div>

        <div class="field">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="Remote / Dhaka, Bangladesh" required>
        </div>

        <div class="field">
            <label for="employmentType">Employment type</label>
            <select id="employmentType" name="employmentType" required>
                <option value="">Select type</option>
                <option th:each="t : ${employmentTypes}" th:value="${t}" th:text="${t.label()}">Full-time</option>
            </select>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="6"
                      placeholder="Responsibilities, requirements, etc." required></textarea>
        </div>

        <button type="submit" class="btn-primary">Post Job</button>
    </form>

    <a th:href="@{/jobs/mine}" style="display:inline-block; margin-top: 1rem;">View my postings</a>

</div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
