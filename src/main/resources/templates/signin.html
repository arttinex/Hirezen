<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In · Hirezen</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <span data-theme-icon>&#9789;</span>
    </button>
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to your account</p>

        <div class="alert alert-error" th:if="${param.error}">
            Invalid email or password.
        </div>
        <div class="alert alert-success" th:if="${param.registered}">
            Account created - you can sign in now.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            You've been signed out.
        </div>

        <form th:action="@{/signin}" method="post">

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" required autofocus>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a th:href="@{/signup}">Create one</a>
        </p>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
