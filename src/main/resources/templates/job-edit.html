<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Job · Hirezen</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header(${roleLabel})}"></div>

<main class="dash-content">
<div class="section-center">

    <h1>Edit Job</h1>

    <form th:action="@{/jobs/{id}/edit(id=${job.id})}" method="post" class="profile-form">

        <div class="field">
            <label for="title">Job title</label>
            <input type="text" id="title" name="title" th:value="${job.title}" required>
        </div>

        <div class="field">
            <label for="companyName">Company name</label>
            <input type="text" id="companyName" name="companyName" th:value="${job.companyName}" required>
        </div>

        <div class="field">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" th:value="${job.location}" required>
        </div>

        <div class="field">
            <label for="employmentType">Employment type</label>
            <select id="employmentType" name="employmentType" required>
                <option th:each="t : ${employmentTypes}" th:value="${t}" th:text="${t.label()}"
                        th:selected="${t == job.employmentType}">Full-time</option>
            </select>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="6" required th:text="${job.description}"></textarea>
        </div>

        <button type="submit" class="btn-primary">Save Changes</button>
    </form>

    <a th:href="@{/jobs/mine}" style="display:inline-block; margin-top: 1rem;">Cancel</a>

</div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
