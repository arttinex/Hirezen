<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile · Hirezen</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header(${roleLabel})}"></div>

<main class="dash-content">
<div class="section-center">

    <div class="profile-header">
        <img th:if="${profile.imageUrl}" th:src="${profile.imageUrl}" class="profile-image-large" alt="Profile photo">
        <div th:unless="${profile.imageUrl}" class="profile-image-large profile-image-placeholder"
             th:text="${#strings.substring(user.name, 0, 1)}">J</div>

        <div>
            <h1 style="margin:0;" th:text="${user.name}">Jane Doe</h1>
            <span class="hirezen-id-badge" th:text="${user.hirezenId}">HZS1</span>
        </div>
    </div>

    <div class="profile-view">
        <div class="profile-row">
            <span class="profile-label">Email</span>
            <span th:text="${user.email}">jane@example.com</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Phone</span>
            <span th:text="${profile.phone} ?: 'Not set'">Not set</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Location</span>
            <span th:text="${profile.location} ?: 'Not set'">Not set</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Bio</span>
            <span th:text="${profile.bio} ?: 'No bio yet.'">No bio yet.</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Skills</span>
            <div class="skills-tags" th:if="${profile.skills}">
                <span class="skill-tag" th:each="skill : ${#strings.arraySplit(profile.skills, ',')}"
                      th:text="${#strings.trim(skill)}">Skill</span>
            </div>
            <span th:unless="${profile.skills}">Not set</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Resume / CV</span>
            <a th:if="${profile.resumeUrl}" th:href="${profile.resumeUrl}" target="_blank" rel="noopener"
               th:text="${profile.resumeFileName} ?: 'View Resume'">View Resume</a>
            <span th:unless="${profile.resumeUrl}">Not uploaded</span>
        </div>
    </div>

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <a th:if="${isOwnProfile}" th:href="@{/profile/edit}" class="btn-primary" style="display:inline-block; width:auto;">Edit Profile</a>
        <a th:unless="${isOwnProfile}" th:href="@{/messages/{id}(id=${user.id})}" class="btn-primary" style="display:inline-block; width:auto;">Message</a>
    </div>

</div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
