<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${partner.name} + ' · Connect · Hirezen'">Chat · Hirezen</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header(${roleLabel})}"></div>

<main class="dash-content">
<div class="section-center">

    <a th:href="@{/messages}" style="display:inline-block; margin-bottom:16px;">&larr; Back to Connect</a>

    <div class="chat-thread-header">
        <div class="chat-avatar" th:text="${#strings.substring(partner.name, 0, 1)}">J</div>
        <div>
            <h2 style="margin:0; font-size:18px;" th:text="${partner.name}">Name</h2>
            <span class="hirezen-id-badge" th:text="${partner.hirezenId}">HZS1</span>
        </div>
        <div class="chat-header-actions">
            <button type="button" class="icon-btn" title="Video call - coming soon" disabled>&#127909;</button>
            <button type="button" class="icon-btn" title="Voice call - coming soon" disabled>&#128222;</button>
        </div>
    </div>

    <div class="chat-thread">
        <div th:each="m : ${thread}" class="chat-bubble"
             th:classappend="${m.sender.id == currentUserId} ? 'chat-bubble-mine' : 'chat-bubble-theirs'">
            <p th:text="${m.content}">Message text</p>
            <span class="chat-bubble-time" th:text="${#temporals.format(m.sentAt, 'HH:mm')}">12:00</span>
        </div>
        <p th:if="${#lists.isEmpty(thread)}" class="lead">Say hello to start the conversation.</p>
    </div>

    <form th:action="@{/messages/{id}(id=${partner.id})}" method="post" class="chat-input-row">
        <input type="text" name="content" placeholder="Type a message..." required autocomplete="off">
        <button type="submit" class="btn-primary">Send</button>
    </form>

</div>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
