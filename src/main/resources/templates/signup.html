<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up · Hirezen</title>
    <th:block th:replace="~{fragments/theme-init :: init}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode">
        <span data-theme-icon>&#9789;</span>
    </button>
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="subtitle">Find your next job or internship, or start hiring.</p>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/signup}" method="post">

            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="Jane Doe" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters"
                       minlength="8" required>
            </div>

            <div class="field">
                <label for="role">I am a...</label>
                <select id="role" name="role" required>
                    <option value="">Select role</option>
                    <!--
                        Only self-registerable roles are ever rendered here (see
                        WebController#selfRegisterableRoles) - ADMIN accounts are not
                        offered as an option, and are also rejected server-side if
                        someone tries to submit one directly.
                    -->
                    <option th:each="r : ${selfRegisterableRoles}"
                            th:value="${r}"
                            th:text="${r == T(com.hirezen.model.Role).JOB_SEEKER} ? 'Job Seeker' : 'Recruiter'">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn-primary">Sign Up</button>
        </form>

        <p class="auth-footer">
            Already have an account? <a th:href="@{/signin}">Sign in</a>
        </p>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
