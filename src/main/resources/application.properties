# ===== Application =====
spring.application.name=hirezen
server.port=9090
server.address=0.0.0.0


spring.datasource.url=jdbc:mysql://localhost:3306/hirezen
spring.datasource.username=root
spring.datasource.password=42378@s,
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# ddl-auto=update is convenient for development; switch to 'validate' + a migration
# tool (Flyway/Liquibase) once the schema stabilizes for production use.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== Logging =====
logging.level.org.springframework.security=INFO
logging.level.com.hirezen=DEBUG
