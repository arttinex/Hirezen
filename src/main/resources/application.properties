# ===== Application =====
spring.application.name=hirezen
server.address=0.0.0.0

# ===== Database (Supabase Postgres) =====
# Values come from Render env vars - set there, not hardcoded here:
#   DATABASE_URL = jdbc:postgresql://db.rumkycfcyeiqzkskeaoh.supabase.co:5432/postgres?sslmode=require
#   DB_USERNAME  = postgres
#   DB_PASSWORD  = <your real Supabase database password>
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== File uploads (profile photos, resumes) =====
# Spring Boot's default is 1MB, which most photos and PDFs exceed.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===== Logging =====
logging.level.org.springframework.security=INFO
logging.level.com.hirezen=DEBUG