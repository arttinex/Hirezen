# ===== Application =====
spring.application.name=hirezen
server.port=8080
# ===== MySQL DataSource =====
# Update username/password to match your local MySQL instance.
# The database itself will be created automatically (createDatabaseIfNotExist=true).
spring.datasource.url=jdbc:mysql://localhost:3306/hirezen?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ===== JPA / Hibernate =====
# ddl-auto=update is convenient for development; switch to 'validate' + a migration
# tool (Flyway/Liquibase) once the schema stabilizes for production use.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# ===== Logging =====
logging.level.org.springframework.security=INFO
logging.level.com.hirezen=DEBUG
