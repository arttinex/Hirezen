<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Seeker Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header('Job Seeker')}"></div>

<main class="dash-content">
    <h1>Job Seeker Dashboard</h1>
    <p class="lead">Track your applications, interviews, and saved jobs.</p>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="value" th:text="${stats.totalApplications()}">0</div>
            <div class="label">Total Applications</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.shortlisted()}">0</div>
            <div class="label">Shortlisted</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.interviewInvitations()}">0</div>
            <div class="label">Interview Invitations</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.rejected()}">0</div>
            <div class="label">Rejected</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.savedJobs()}">0</div>
            <div class="label">Saved Jobs</div>
        </div>
    </div>
</main>

</body>
</html>
