<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recruiter Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header('Recruiter')}"></div>

<main class="dash-content">
    <h1>Recruiter Dashboard</h1>
    <p class="lead">Manage your job postings and applicants.</p>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="value" th:text="${stats.totalJobs()}">0</div>
            <div class="label">Total Jobs</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.activeJobs()}">0</div>
            <div class="label">Active Jobs</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.totalApplicants()}">0</div>
            <div class="label">Total Applicants</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.shortlisted()}">0</div>
            <div class="label">Shortlisted Applicants</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.rejected()}">0</div>
            <div class="label">Rejected Applicants</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.upcomingInterviews()}">0</div>
            <div class="label">Upcoming Interviews</div>
        </div>
    </div>
</main>

</body>
</html>
