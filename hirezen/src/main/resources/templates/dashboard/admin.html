<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/header :: dash-header('Admin')}"></div>

<main class="dash-content">
    <h1>Admin Dashboard</h1>
    <p class="lead">Platform-wide overview.</p>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="value" th:text="${stats.totalUsers()}">0</div>
            <div class="label">Total Users</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.totalJobSeekers()}">0</div>
            <div class="label">Total Job Seekers</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.totalRecruiters()}">0</div>
            <div class="label">Total Recruiters</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.totalCompanies()}">0</div>
            <div class="label">Total Companies</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.totalJobs()}">0</div>
            <div class="label">Total Jobs</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.totalApplications()}">0</div>
            <div class="label">Total Applications</div>
        </div>
        <div class="stat-card">
            <div class="value" th:text="${stats.activeJobs()}">0</div>
            <div class="label">Active Jobs</div>
        </div>
    </div>
</main>

</body>
</html>
